plugins {
    id "net.neoforged.moddev" version "2.0.141"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// Priority 20 port staging. See gradle/port-manifest.txt, which is the
// authoritative list. A gate that compiles more or less than the manifest says
// is not a gate, so the two must be edited together.
// No default. A silent default turns every documented plain `./gradlew build`
// into a partial build that still reports success, which is exactly the failure
// this manifest exists to prevent.
if (!providers.gradleProperty("portStage").isPresent()) {
    throw new GradleException(
        "portStage must be set explicitly during the priority 20 port.\n" +
        "  -PportStage=core   loader-neutral only: 85 of 195 main files, 15 of 47 test classes\n" +
        "  -PportStage=full   everything; only passes once the port completes\n" +
        "See gradle/port-manifest.txt. Remove this guard when priority 20 lands.")
}
def portStage = providers.gradleProperty("portStage").get()
def manifest = file("gradle/port-manifest.txt")
def stagePatterns = { String stage, String key ->
    def out = []
    def active = false
    manifest.eachLine { line ->
        def t = line.trim()
        if (t.startsWith("[stage:")) {
            active = (t == "[stage:${stage}]")
        } else if (active && t.startsWith("${key} =")) {
            out << t.substring(t.indexOf('=') + 1).trim()
        }
    }
    if (out.isEmpty()) {
        throw new GradleException("port-manifest.txt defines no ${key} for stage '${stage}'")
    }
    return out
}

sourceSets {
    main {
        java {
            setIncludes(stagePatterns(portStage, "main.include"))
        }
    }
    test {
        java {
            setIncludes(stagePatterns(portStage, "test.include"))
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = file("run/client")
            programArguments.addAll("--quickPlayMultiplayer", "localhost:25575")
        }
        server {
            server()
            gameDirectory = file("run/server")
        }
        // Phase 10 needs a runner that yields a real process exit code. Standing
        // it up here means phase 10 ports tests instead of building harnesses.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file("run/gametest")
        }
    }

    mods {
        "vector_regnum" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def props = [version: project.version,
                 minecraft_version_range: project.minecraft_version_range,
                 neo_version_range: project.neo_version_range,
                 loader_version_range: project.loader_version_range]
    inputs.properties props
    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

// Print what the manifest actually selected, so a green build cannot hide an
// empty source set.
tasks.register("portStageReport") {
    doLast {
        println "portStage       = ${portStage}"
        println "main sources    = ${sourceSets.main.java.files.size()} files"
        println "test sources    = ${sourceSets.test.java.files.size()} files"
    }
}
